<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>RSVP 관리자 | 윤성호 ♥ 피영아</title>
  <style>
    :root{--bg:#eef3f7;--paper:#fbfdff;--ink:#253247;--muted:#748093;--main:#6f8faf;--main-dark:#526f8d;--line:#d8e2ec;--success-bg:#e8f5ec;--success:#36784c;--danger-bg:#f8e9e9;--danger:#a84949;--pending-bg:#f5f0df;--pending:#8a7138;--shadow:0 14px 34px rgba(37,50,71,.08)}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent}.hidden{display:none!important}.page{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-card{width:min(420px,100%);margin:70px auto 0;padding:28px 24px}.eyebrow{margin:0 0 6px;color:var(--main);font-size:12px;font-weight:800;letter-spacing:.15em}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:500;line-height:1.25}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}.field{margin-top:16px}label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(111,143,175,.14)}.button{min-height:44px;border:0;border-radius:13px;padding:11px 16px;background:var(--main);color:#fff;font-weight:800;cursor:pointer}.button:hover{background:var(--main-dark)}.button.light{background:#e4ecf3;color:#31445d}.button.light:hover{background:#d8e3ed}.button.full{width:100%;margin-top:18px}.button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;margin-top:10px;color:var(--danger);font-size:13px}.admin-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.summary-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}.summary-card{min-width:0;padding:17px 16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 9px 24px rgba(37,50,71,.05)}.summary-label{overflow:hidden;color:var(--muted);font-size:12px;white-space:nowrap;text-overflow:ellipsis}.summary-value{margin-top:4px;font-size:25px;font-weight:900;line-height:1.2}.side-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.side-card{padding:17px}.side-title{color:var(--main);font-size:13px;font-weight:900}.side-number{margin-top:3px;font-size:23px;font-weight:900}.side-detail{margin-top:4px;color:var(--muted);font-size:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;align-items:end;margin-bottom:16px;padding:16px}.toolbar .field{margin:0}.result-info{margin:0 0 10px 3px;color:var(--muted);font-size:13px}.guest-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.guest-card{padding:18px}.guest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.guest-name{margin:0;font-size:19px;font-weight:900}.guest-side{margin-top:2px;color:var(--muted);font-size:13px}.status{flex:0 0 auto;display:inline-flex;align-items:center;min-height:28px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900}.status-attend{background:var(--success-bg);color:var(--success)}.status-absent{background:var(--danger-bg);color:var(--danger)}.status-pending{background:var(--pending-bg);color:var(--pending)}.guest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.guest-stat{padding:10px;border-radius:13px;background:#f4f8fb;text-align:center}.guest-stat-label{color:var(--muted);font-size:11px}.guest-stat-value{margin-top:2px;font-size:15px;font-weight:900}.guest-meta{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);color:#526173;font-size:13px;word-break:break-word}.guest-meta-row+.guest-meta-row{margin-top:6px}.guest-meta-label{display:inline-block;min-width:58px;color:var(--muted);font-size:12px;font-weight:800}.empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}
    @media(max-width:920px){.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}}
    @media(max-width:680px){.page{width:min(100% - 20px,1180px);padding-top:18px}.login-card{margin-top:30px}.admin-header{flex-direction:column}.header-actions{width:100%;justify-content:stretch}.header-actions .button{flex:1}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.guest-list{grid-template-columns:1fr}h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="page">
    <section id="loginView" class="card login-card">
      <p class="eyebrow">WEDDING RSVP ADMIN</p><h1>윤성호 ♥ 피영아</h1><p class="subtitle">관리자 계정으로 로그인해 주세요.</p>
      <form id="loginForm">
        <div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required /></div>
        <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required /></div>
        <button id="loginButton" class="button full" type="submit">로그인</button><div id="loginError" class="error" aria-live="polite"></div>
      </form>
    </section>
    <main id="adminView" class="hidden">
      <header class="admin-header"><div><p class="eyebrow">WEDDING RSVP ADMIN</p><h1>결혼식 참석 현황</h1><p id="updatedAt" class="subtitle">데이터를 불러오는 중입니다.</p></div><div class="header-actions"><button id="downloadButton" class="button light" type="button">엑셀용 CSV</button><button id="refreshButton" class="button" type="button">새로고침</button><button id="logoutButton" class="button light" type="button">로그아웃</button></div></header>
      <section class="summary-grid">
        <article class="summary-card"><div class="summary-label">전체 응답</div><div id="totalCount" class="summary-value">0</div></article>
        <article class="summary-card"><div class="summary-label">참석 응답</div><div id="attendCount" class="summary-value">0</div></article>
        <article class="summary-card"><div class="summary-label">불참 응답</div><div id="absentCount" class="summary-value">0</div></article>
        <article class="summary-card"><div class="summary-label">미정 응답</div><div id="pendingCount" class="summary-value">0</div></article>
        <article class="summary-card"><div class="summary-label">예상 참석 인원</div><div id="peopleCount" class="summary-value">0</div></article>
        <article class="summary-card"><div class="summary-label">예상 식사 인원</div><div id="mealCount" class="summary-value">0</div></article>
      </section>
      <section class="side-grid"><article class="card side-card"><div class="side-title">신랑측</div><div id="groomPeople" class="side-number">0명</div><div id="groomDetail" class="side-detail">응답 0건 · 식사 0명</div></article><article class="card side-card"><div class="side-title">신부측</div><div id="bridePeople" class="side-number">0명</div><div id="brideDetail" class="side-detail">응답 0건 · 식사 0명</div></article></section>
      <section class="card toolbar">
        <div class="field"><label for="sideFilter">구분</label><select id="sideFilter"><option value="">전체</option><option value="신랑측">신랑측</option><option value="신부측">신부측</option></select></div>
        <div class="field"><label for="attendanceFilter">참석 여부</label><select id="attendanceFilter"><option value="">전체</option><option value="참석">참석</option><option value="불참">불참</option><option value="미정">미정</option></select></div>
        <div class="field"><label for="searchInput">검색</label><input id="searchInput" type="search" placeholder="성함 또는 연락처" /></div>
        <button id="clearFilterButton" class="button light" type="button">필터 초기화</button>
      </section>
      <p id="resultInfo" class="result-info">0건 표시 중</p><section id="guestList" class="guest-list"></section><div id="loadingMessage" class="card loading hidden">데이터를 불러오는 중입니다.</div><div id="emptyMessage" class="card empty hidden">조건에 해당하는 RSVP가 없습니다.</div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL="https://ertvibwumqwotubzcbhv.supabase.co";
    const SUPABASE_ANON_KEY="sb_publishable_dD8IZ9Exz5lSFfYhgHYXgg_4vKwjLMq";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let allRsvps=[];
    const loginView=document.getElementById("loginView"),adminView=document.getElementById("adminView"),loginForm=document.getElementById("loginForm"),loginButton=document.getElementById("loginButton"),loginError=document.getElementById("loginError"),sideFilter=document.getElementById("sideFilter"),attendanceFilter=document.getElementById("attendanceFilter"),searchInput=document.getElementById("searchInput"),refreshButton=document.getElementById("refreshButton"),downloadButton=document.getElementById("downloadButton"),guestList=document.getElementById("guestList"),loadingMessage=document.getElementById("loadingMessage"),emptyMessage=document.getElementById("emptyMessage"),resultInfo=document.getElementById("resultInfo");
    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function getTotalPeople(row){return row.attendance==="참석"?1+Number(row.companions||0):0}
    function getMealCount(row){return row.attendance==="참석"?Number(row.meal_count||0):0}
    function formatDate(value){if(!value)return "-";return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(value))}
    function getStatusClass(attendance){if(attendance==="참석")return "status-attend";if(attendance==="불참")return "status-absent";return "status-pending"}
    function getFilteredRows(){const side=sideFilter.value,attendance=attendanceFilter.value,keyword=searchInput.value.trim().toLowerCase();return allRsvps.filter(row=>{const matchesSide=!side||row.side===side,matchesAttendance=!attendance||row.attendance===attendance,searchableText=`${row.name||""} ${row.phone||""}`.toLowerCase(),matchesKeyword=!keyword||searchableText.includes(keyword);return matchesSide&&matchesAttendance&&matchesKeyword})}
    function renderSideSummary(side,peopleId,detailId){const sideRows=allRsvps.filter(row=>row.side===side),attendingRows=sideRows.filter(row=>row.attendance==="참석"),people=attendingRows.reduce((sum,row)=>sum+getTotalPeople(row),0),meals=attendingRows.reduce((sum,row)=>sum+getMealCount(row),0);document.getElementById(peopleId).textContent=`${people}명`;document.getElementById(detailId).textContent=`응답 ${sideRows.length}건 · 참석 ${attendingRows.length}건 · 식사 ${meals}명`}
    function renderGlobalSummary(){const attendRows=allRsvps.filter(row=>row.attendance==="참석");document.getElementById("totalCount").textContent=allRsvps.length;document.getElementById("attendCount").textContent=attendRows.length;document.getElementById("absentCount").textContent=allRsvps.filter(row=>row.attendance==="불참").length;document.getElementById("pendingCount").textContent=allRsvps.filter(row=>row.attendance==="미정").length;document.getElementById("peopleCount").textContent=attendRows.reduce((sum,row)=>sum+getTotalPeople(row),0);document.getElementById("mealCount").textContent=attendRows.reduce((sum,row)=>sum+getMealCount(row),0);renderSideSummary("신랑측","groomPeople","groomDetail");renderSideSummary("신부측","bridePeople","brideDetail")}
    function renderGuests(){const rows=getFilteredRows();resultInfo.textContent=`${rows.length}건 표시 중 · 전체 ${allRsvps.length}건`;if(!rows.length){guestList.innerHTML="";emptyMessage.classList.remove("hidden");return}emptyMessage.classList.add("hidden");guestList.innerHTML=rows.map(row=>`<article class="card guest-card"><div class="guest-head"><div><h2 class="guest-name">${escapeHtml(row.name)}</h2><div class="guest-side">${escapeHtml(row.side)}</div></div><span class="status ${getStatusClass(row.attendance)}">${escapeHtml(row.attendance)}</span></div><div class="guest-grid"><div class="guest-stat"><div class="guest-stat-label">총 참석 인원</div><div class="guest-stat-value">${getTotalPeople(row)}명</div></div><div class="guest-stat"><div class="guest-stat-label">동반 인원</div><div class="guest-stat-value">${Number(row.companions||0)}명</div></div><div class="guest-stat"><div class="guest-stat-label">식사 인원</div><div class="guest-stat-value">${getMealCount(row)}명</div></div></div><div class="guest-meta"><div class="guest-meta-row"><span class="guest-meta-label">연락처</span><a href="tel:${escapeHtml(row.phone)}">${escapeHtml(row.phone)}</a></div><div class="guest-meta-row"><span class="guest-meta-label">전달사항</span>${escapeHtml(row.memo||"-")}</div><div class="guest-meta-row"><span class="guest-meta-label">제출 시각</span>${formatDate(row.created_at)}</div></div></article>`).join("")}
    function renderAll(){renderGlobalSummary();renderGuests()}
    async function loadRsvps(){refreshButton.disabled=true;refreshButton.textContent="불러오는 중...";loadingMessage.classList.remove("hidden");emptyMessage.classList.add("hidden");guestList.innerHTML="";const{data,error}=await supabaseClient.from("rsvp").select("id, side, name, phone, attendance, companions, meal_count, memo, created_at").order("created_at",{ascending:false});refreshButton.disabled=false;refreshButton.textContent="새로고침";loadingMessage.classList.add("hidden");if(error){console.error("RSVP 조회 오류:",error);alert("RSVP 데이터를 불러오지 못했습니다. 로그인 계정과 RLS SELECT 정책을 확인해주세요.");return}allRsvps=data||[];renderAll();document.getElementById("updatedAt").textContent=`마지막 조회: ${new Date().toLocaleString("ko-KR")}`}
    async function showAdmin(session){if(!session){loginView.classList.remove("hidden");adminView.classList.add("hidden");return}loginView.classList.add("hidden");adminView.classList.remove("hidden");await loadRsvps()}
    loginForm.addEventListener("submit",async event=>{event.preventDefault();loginError.textContent="";loginButton.disabled=true;loginButton.textContent="로그인 중...";const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});loginButton.disabled=false;loginButton.textContent="로그인";if(error){console.error("로그인 오류:",error);loginError.textContent="이메일 또는 비밀번호를 확인해주세요.";return}await showAdmin(data.session)});
    document.getElementById("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();allRsvps=[];await showAdmin(null)});
    refreshButton.addEventListener("click",loadRsvps);sideFilter.addEventListener("change",renderGuests);attendanceFilter.addEventListener("change",renderGuests);searchInput.addEventListener("input",renderGuests);
    document.getElementById("clearFilterButton").addEventListener("click",()=>{sideFilter.value="";attendanceFilter.value="";searchInput.value="";renderGuests()});
    function csvCell(value){const text=String(value??"");return `"${text.replaceAll('"','""')}"`}
    downloadButton.addEventListener("click",()=>{const rows=getFilteredRows();if(!rows.length){alert("다운로드할 RSVP 데이터가 없습니다.");return}const header=["구분","성함","연락처","참석 여부","총 참석 인원","동반 인원","식사 인원","전달사항","제출 시각"],csvRows=rows.map(row=>[row.side,row.name,row.phone,row.attendance,getTotalPeople(row),Number(row.companions||0),getMealCount(row),row.memo||"",formatDate(row.created_at)]),csv="\uFEFF"+[header,...csvRows].map(row=>row.map(csvCell).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`wedding-rsvp-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)});
    async function initialize(){const{data:{session},error}=await supabaseClient.auth.getSession();if(error)console.error("세션 확인 오류:",error);await showAdmin(session)}initialize();
  </script>
</body>
</html>
